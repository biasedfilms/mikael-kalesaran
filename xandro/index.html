<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XANDRO</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="theme-color" content="#D63A4F">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div id="dashboard-background">
        <video id="background-video" autoplay muted loop playsinline>
            <source src="assets/video/topo.webm" type="video/webm">
        </video>

        <div class="background-overlay"></div>
    </div>

    

    <!-- ========================================
            XANDRO FIRST LAUNCH EXPERIENCE
    ======================================== -->

    <div id="boot-screen">

    <!-- ========================================
         BOOT CENTER
    ========================================= -->

    <div id="boot-center">

        <div class="boot-branding">

            <h1 id="boot-logo">XANDRO</h1>

            <p id="boot-tagline">
                PERSONAL DASHBOARD.
            </p>

        </div>

    </div>

    <!-- ========================================
         WELCOME LAYER
    ========================================= -->

    <div id="welcome-layer">

        <div id="welcome-content">

            <h2>Welcome.</h2>

            <p class="welcome-subtitle">
                What should we call you?
            </p>

            <input
                id="name-input"
                placeholder="Enter your name"
            >

            <div class="welcome-actions">

                <p id="name-error"></p>

                <button id="continue-btn">
                    Proceed ➤
                </button>

            </div>

        </div>

    </div>

</div>    

    <div id="app">

    <main class="dashboard">

        <!-- ===================================== -->
        <!-- HEADER -->
        <!-- ===================================== -->

        

        <header class="top-bar">

            <div class="branding">

                <h1>XANDRO</h1>

                <p id="greeting">

                    Loading...

                </p>

                <span class="dashboard-tagline">

                    Personal Dashboard

                </span>

            </div>

            <div class="header-center">

                <div
                    class="clock"
                    id="current-time">

                    00:00:00

                </div>

                <div
                    class="date"
                    id="current-date">

                    Loading...

                </div>

            </div>

            <div class="weather">

                <div class="weather-main">

                    <span id="weather-icon">☀</span>

                    <span id="weather-temp">--°</span>

                </div>

                <div class="weather-location">

                    <span id="weather-city">

                        Loading...

                    </span>

                </div>

            </div>

        </header>



        <!-- ===================================== -->
        <!-- DASHBOARD -->
        <!-- ===================================== -->

        <section class="dashboard-grid">



            <!-- ===================================== -->
            <!-- LEFT COLUMN -->
            <!-- ===================================== -->

            <div class="left-column">



                <!-- ===================================== -->
                <!-- TODAY'S TASKS -->
                <!-- ===================================== -->

                <section
                    class="card"
                    id="todo-card">

                    <div class="card-header">

                        <h2>Today's Tasks</h2>

                        <button id="add-task-btn">

                            +

                        </button>

                    </div>



                    <div class="task-input-container hidden">

                        <input
                            type="text"
                            id="task-input"
                            placeholder="What needs to be done today?"
                            maxlength="100">

                    </div>



                    <div class="todo-content">

                        <ul id="task-list">

                            <!-- Generated by todo.js -->

                        </ul>

                    </div>

                </section>



                <!-- ===================================== -->
                <!-- NOTES -->
                <!-- ===================================== -->

                <section class="card notes">

                    <div class="card-header">

                        <h2>Notes</h2>

                        <span id="notes-status">

                            Saved

                        </span>

                    </div>

                    <div class="notes-content">

                        <textarea
                            id="notes-input"
                            placeholder="Write anything..."></textarea>

                    </div>

                </section>



            </div>



            <!-- ===================================== -->
            <!-- RIGHT COLUMN -->
            <!-- ===================================== -->

            <div class="right-column">



                <!-- ===================================== -->
                <!-- QUOTE -->
                <!-- ===================================== -->

                <section class="card quote">

                    <h2>Quote</h2>

                    <blockquote id="quote-text">

                        Loading...

                    </blockquote>

                    <p id="quote-author">

                        Unknown

                    </p>

                </section>



                <!-- ===================================== -->
                <!-- PROGRESS -->
                <!-- ===================================== -->

                <section class="card progress">

                    <h2>Progress</h2>

                    <div class="progress-container">

                        <div class="progress-bar">

                            <div id="progress-fill"></div>

                        </div>

                        <div class="progress-stats">

                            <p>

                                <span id="completed-count">0</span>

                                /

                                <span id="total-count">0</span>

                                Tasks Completed

                            </p>

                            <h3 id="progress-percent">

                                0%

                            </h3>

                        </div>

                    </div>

                </section>



                <!-- ===================================== -->
                <!-- GOALS -->
                <!-- ===================================== -->

                <section class="card goals">

                    <div class="card-header">

                        <h2>Goals</h2>

                        <button id="add-goal-btn">

                            +

                        </button>

                    </div>

                    <div class="goal-input-container hidden">

                        <input
                            id="goal-input"
                            type="text"
                            placeholder="What is your next goal?"
                            maxlength="120">

                    </div>

                    <div class="goals-content">

                        <ul id="goals-list">

                            <!-- Generated by goals.js -->

                        </ul>

                    </div>

                </section>



            </div>

        </section>

    </main>


    </div>
    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script src="js/storage.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/greeting.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/goals.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/config.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
